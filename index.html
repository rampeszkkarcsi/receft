<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recept vagy receft</title>
  <link rel="stylesheet" href="styles.css">
  <style>
/* Gombok a jobb felső sarokban */
.add-recipe-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 1000;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: var(--accent);
  font-size: 0.9rem;
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
}

/* Második gomb - kicsit arrébb */
.add-recipe-btn + .add-recipe-btn {
  right: 130px; /* 16px + gomb szélessége + 10px gap */
}

.add-recipe-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  background: #fff9f5;
}

@media (max-width: 640px) {
  .add-recipe-btn {
    top: 10px;
    right: 10px;
    padding: 8px 12px;
    font-size: 0.85rem;
  }
  
  .add-recipe-btn + .add-recipe-btn {
    right: 120px; /* Mobilon kicsit közelebb */
  }
}
  </style>
</head>
<body>
	<!-- Gombok a jobb felső sarokban -->
	<a href="https://forms.gle/9j17SkGdGqoEPMRp9" class="add-recipe-btn" target="_blank">➕ Új recept</a>
	<a href="pdf-viewer.html" class="add-recipe-btn" target="_blank">📖 Minerva</a>
</div>
  

  <main class="container">
    <h1>Recept vagy receft</h1>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Keresés alapanyagra vagy címre...">
      <div id="resultCount" class="muted"></div>
    </div>

    <section id="recipes" class="grid"></section>
  </main>

  <template id="recipeTemplate">
    <article class="card">
      <img class="thumb" alt="">
      <div class="card-body">
        <button class="card-toggle" type="button" aria-expanded="false">
          <h2 class="title"></h2>
          <div class="meta"></div>
          <div class="preview-ingredients"></div>
        </button>

        <div class="card-expanded">
          <div class="expanded-section">
            <h3>Hozzávalók</h3>
            <div class="expanded-ingredients ingredients"></div>
          </div>

          <div class="expanded-section">
            <h3>Elkészítés</h3>
            <div class="steps"></div>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
